<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1A2332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <!-- Dark squared background (iOS rounds corners automatically) -->
  <rect x="0" y="0" width="180" height="180" fill="url(#bg)"/>
  <!-- Perspective road bars — gets wider toward bottom -->
  <rect x="52" y="26" width="76" height="14" rx="7" fill="url(#accent)"/>
  <rect x="42" y="58" width="96" height="14" rx="7" fill="url(#accent)" opacity="0.85"/>
  <rect x="32" y="90" width="116" height="16" rx="8" fill="url(#accent)" opacity="0.7"/>
  <rect x="20" y="124" width="140" height="18" rx="9" fill="url(#accent)" opacity="0.55"/>
  <!-- Bottom highlight bar -->
  <rect x="6" y="162" width="168" height="12" rx="6" fill="url(#accent)" opacity="0.4"/>
</svg>
