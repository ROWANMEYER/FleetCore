<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1A2332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <!-- Rounded dark background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Perspective road bars — gets wider toward bottom -->
  <rect x="10" y="5" width="12" height="3" rx="1.5" fill="url(#accent)"/>
  <rect x="8" y="11" width="16" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
  <rect x="6" y="17" width="20" height="3" rx="1.5" fill="url(#accent)" opacity="0.7"/>
  <rect x="4" y="23" width="24" height="4" rx="2" fill="url(#accent)" opacity="0.55"/>
</svg>
